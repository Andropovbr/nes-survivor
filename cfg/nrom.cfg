SYMBOLS {
    __STACKSIZE__: type = weak, value = $0300;
}

MEMORY {
    ZP:      file = "", start = $0002, size = $001E, type = rw, define = yes;
    OAM:     file = "", start = $0200, size = $0100, type = rw, define = yes;
    RAM:     file = "", start = $0300, size = $0200, type = rw, define = yes;
    STACK:   file = "", start = $0500, size = __STACKSIZE__, type = rw, define = yes;

    HEADER:  file = %O, start = $0000, size = $0010, fill = yes, fillval = $00;
    PRG:     file = %O, start = $8000, size = $7FFA, fill = yes, fillval = $FF, define = yes;
    VECTORS: file = %O, start = $FFFA, size = $0006, fill = yes, fillval = $FF;
    CHR:     file = %O, start = $0000, size = $2000, fill = yes, fillval = $00, define = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP,               type = zp;
    OAM:      load = OAM,              type = bss;
    HEADER:   load = HEADER,           type = ro;
    STARTUP:  load = PRG,              type = ro,  define = yes;
    LOWCODE:  load = PRG,              type = ro,  optional = yes;
    ONCE:     load = PRG,              type = ro,  optional = yes;
    CODE:     load = PRG,              type = ro,  define = yes;
    RODATA:   load = PRG,              type = ro,  define = yes;
    DATA:     load = PRG, run = RAM,   type = rw,  define = yes;
    BSS:      load = RAM,              type = bss, define = yes;
    VECTORS:  load = VECTORS,          type = ro;
    CHARS:    load = CHR,              type = ro;
}

FEATURES {
    CONDES: type = constructor,
            label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type = destructor,
            label = __DESTRUCTOR_TABLE__,
            count = __DESTRUCTOR_COUNT__,
            segment = RODATA;
}
